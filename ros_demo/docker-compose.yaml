
services:
  ros:
    build: ./workspace
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      ROS_HOME: /tmp/ros2-home
      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    command: bash
