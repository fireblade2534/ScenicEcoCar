sensors:
  front_camera:
    type: "sensor.camera.rgb"
    transform:
      position:
        x: 1.2
        y: 0.0
        z: 2.0
      rotation:
        pitch: -20.0
        yaw: 0.0
        roll: 0.0
    attributes:
      image_size_x: 1280
      image_size_y: 720
      fov: 100.0
      sensor_tick: 0.05
  
  back_camera:
    type: "sensor.camera.rgb"
    transform:
      position:
        x: -2.0
        y: 0.0
        z: 2.0
      rotation:
        pitch: -20.0
        yaw: 180.0
        roll: 0.0
    attributes:
      image_size_x: 1280
      image_size_y: 720
      fov: 100.0
      sensor_tick: 0.05

  front_radar:
    type: "sensor.other.radar"
    transform:
      position:
        x: 1.3
        y: 0.0
        z: 1.3
      rotation:
        pitch: 0.0
        yaw: 0.0
        roll: 0.0
    attributes:
      horizontal_fov: 5.0
      vertical_fov: 5.0
      range: 200.0
      points_per_second: 8000

  imu:
    type: "sensor.other.imu"
    transform:
      position:
        x: 0.0
        y: 0.0
        z: 0.0
      rotation:
        pitch: 0.0
        yaw: 0.0
        roll: 0.0

  gnss:
    type: "sensor.other.gnss"
    transform:
      position:
        x: 0.0
        y: 0.0
        z: 0.0
      rotation:
        pitch: 0.0
        yaw: 0.0
        roll: 0.0

  top_lidar:
    type: "sensor.lidar.ray_cast"
    transform:
      position:
        x: 0.0
        y: 0.0
        z: 2.3
      rotation:
        pitch: 0.0
        yaw: 0.0
        roll: 0.0
    attributes:
      channels: 64
      range: 120.0
      upper_fov: 10
      lower_fov: -25.5
      horizontal_fov: 360.0
      rotation_frequency: 20.0
      points_per_second: 90000
