[project]
name = "scenicecocar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fireblade2534", email = "fireblade5234@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "carla==0.9.16",
    "dill>=0.4.1",
    "mcap>=1.6.0",
    "pyyaml>=6.0.3",
    "scenic>=3.1.1",
    "websockets>=17.4",
]

[tool.uv.sources]
scenic = { path = "./vendor/scenic", editable = true }

[project.scripts]
scenicecocar = "scenicecocar.core:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
